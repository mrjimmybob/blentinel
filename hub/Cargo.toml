[package]
name = "hub"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hub_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hub"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8.0" }
leptos_router = { version = "0.8.0" }
leptos_meta = { version = "0.8.0" }

axum = { version = "0.8.0", optional = true, features = ["macros"] }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
leptos_axum = { version = "0.8.0", optional = true }

console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
gloo-net = { version = "0.6", features = ["http"], optional = true }
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Storage",
    "Document",
    "Element",
    "HtmlInputElement",
    "File",
    "FileList",
    "Blob",
], optional = true }

common = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true, optional = true }

# Crypto / security (SSR only)
hex = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
# User passwords (argon2id, proposal 0001)
argon2 = { version = "0.5", features = ["std"], optional = true }

# Database (SSR only)
chrono = { workspace = true, optional = true }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "macros", "chrono", "migrate"], optional = true }

# TLS/HTTPS support (SSR only)
rcgen = { version = "0.13", features = ["pem", "x509-parser"], optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2.1", optional = true }
tokio-rustls = { version = "0.26", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
sha2 = { workspace = true, optional = true }
time = { version = "0.3", optional = true }

# Logging (SSR only; the browser UI logs to the console)
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# Email/SMTP (SSR only)
# rustls, not native-tls (OpenSSL): the hub builds as a static musl binary (D-57)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "rustls", "rustls-platform-verifier", "ring"], optional = true }

# Server administration (SSR only, M2-08): `hub backup` archives, `hub doctor`'s disk check
tar = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
sysinfo = { version = "0.33", default-features = false, features = ["disk"], optional = true }

# Windows: the hub runs as a Windows service (M2-08); installing it and its
# folder permissions are in common::service
[target.'cfg(windows)'.dependencies]
windows-service = "0.6"

[features]
hydrate = [
    "leptos/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:gloo-net",
    "dep:web-sys",
]

ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:chrono",
    "dep:sqlx",
    "common/crypto",
    "common/watch",
    "common/service",
    "dep:hex",
    "dep:rand",
    "dep:x25519-dalek",
    "dep:argon2",
    "dep:toml",
    "dep:async-trait",
    "dep:rcgen",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:tokio-rustls",
    "dep:tokio-util",
    "dep:axum-server",
    "dep:sha2",
    "dep:time",
    "dep:lettre",
    "dep:tar",
    "dep:tempfile",
    "dep:flate2",
    "dep:sysinfo",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[dev-dependencies]
# Integration test harness (hub/tests/): drive the real Router in-process.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# HTTPS client for the listener tests (split mode, D-43); the probe's version.
reqwest = { version = "0.13.1" }
tempfile = { workspace = true }
# Tests act as a probe: they need an Ed25519 identity to sign reports.
ed25519-dalek = { workspace = true }

[package.metadata.leptos]
name = "blentinel_hub"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
# Browser tests: `npm test` in hub/end2end (it starts its own hub and probe),
# not `cargo leptos end-to-end`, which would start a hub without a config.
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
