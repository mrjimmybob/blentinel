[package]
name = "probe"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The glue: shared models, protocol constants, and sealing/signing (common::crypto)
common = { workspace = true, features = ["crypto", "service"] }
# Enables `async fn` in trait definitions used with dyn dispatch (Check, ReportSender)
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Identity: Ed25519 key generation, hex encoding of keys
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }

# Networking: HTTP & HTTPS. reqwest 0.13 uses rustls (no OpenSSL, FP-2).
# Certificate pinning (tls.rs) configures rustls directly: the same version and
# aws-lc-rs provider reqwest uses, so no second TLS stack (D-47).
reqwest = { version = "0.13.1", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
sha2 = { workspace = true }

# Monitoring: TLS certificates (checks/certificate.rs). The handshake is
# rustls's (tokio-rustls is what reqwest uses too); the authorities trusted
# are Mozilla's list compiled into the probe, never the machine's certificate
# store (FP-2); x509-parser reads the certificate's dates (pure Rust).
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "1"
x509-parser = { workspace = true }

# Monitoring: Ping
surge-ping = "0.8"

# System info
hostname = "0.4"
chrono = { workspace = true }
sysinfo = "0.33"

# Storage: offline report buffer (bundled SQLite, no system library)
sqlx = { workspace = true, features = ["runtime-tokio"] }

# Logging: structured, dual-output (file + stdout)
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"

# `probe install` talks to systemd over D-Bus: pure Rust, no `systemctl` (FP-2, D-53)
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
# Windows Service Control Manager integration
windows-service = "0.6"

[dev-dependencies]
tempfile = { workspace = true }
# Certificates for a local TLS server: to test certificate pinning (tls.rs)
# and the `tls` check (checks/certificate.rs)
rcgen = "0.13"
x25519-dalek = { workspace = true }
