[package]
name = "common"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
crypto = [
    "dep:chacha20poly1305",
    "dep:ed25519-dalek",
    "dep:hex",
    "dep:rand",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
    "dep:x25519-dalek",
]
# Config-file watching for hot reload (probe and hub server; not the WASM UI).
watch = ["dep:notify", "dep:tokio", "dep:tracing"]
# Installing as a service (hub and probe, D-52, D-53): the Windows parts.
service = ["dep:thiserror", "dep:windows-service", "dep:windows-sys"]

[dependencies]
serde = { workspace = true }
chrono = { workspace = true }

chacha20poly1305 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"], optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-service = { version = "0.6", optional = true }
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
