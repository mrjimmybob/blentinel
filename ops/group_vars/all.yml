---
# Phase 4E: Probe enrollment code is stored in the control host's Vault
# (e.g., host_vars/atlas/vault.yml in production, host_vars/lab-control/vault.yml in the example).
# This file references it so both the control host and staging can access the same secret.
# The actual encrypted value comes from the host Vault via ansible-vault.
#
# Probe enrollment code is stored in the control host's Vault and shared with all hosts
# via hostvars lookup. The control host is determined by checking for known hostnames.
# Prefer 'atlas' (production) or fall back to 'lab-control' (example).
probe_staging_code: |
  {{
    hostvars.get('atlas', {}).get('probe_staging_code', '') or
    hostvars.get('lab-control', {}).get('probe_staging_code', '')
  }}
