# The ops playbooks (proposal 0013 phase 3, D-105). Run from this folder.
# The inventory is private and lives outside Git, on lab-control.
[defaults]
inventory = /etc/blentinel-ops/inventory
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
host_key_checking = True

[ssh_connection]
pipelining = True
