---
# The drop-in was checked alone when it was written; this checks it together
# with the rest of sshd's configuration before sshd is told to use it.
- name: Check the whole sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  listen: Reload sshd

- name: Reload the ssh service
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  listen: Reload sshd

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
