---
- name: Check the admin account exists (the installer creates it, with its password)
  ansible.builtin.getent:
    database: passwd
    key: "{{ base_admin_user }}"

- name: Check there is a key to log in with
  ansible.builtin.assert:
    that: base_admin_keys | length > 0
    fail_msg: base_admin_keys is empty, so no key could log in over SSH after this run.
    quiet: true

- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: Let the admin account use sudo (with its password)
  ansible.builtin.user:
    name: "{{ base_admin_user }}"
    groups: [sudo]
    append: true

- name: Allow only the inventory's keys for the admin account
  ansible.posix.authorized_key:
    user: "{{ base_admin_user }}"
    key: "{{ base_admin_keys | join('\n') }}"
    exclusive: true

# authorized_key leaves the mode of a file that already exists alone.
- name: Let only the admin account write its authorized_keys
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd[base_admin_user][4] }}/.ssh/authorized_keys"
    owner: "{{ base_admin_user }}"
    mode: "0600"

- name: Configure sshd (keys only, no root, listed users only)
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/10-ops.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Set the timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Create the journald drop-in folder
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep the journal on disk, with a size cap
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/10-ops.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Install security updates every day
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
