---
- name: Check SSH stays reachable
  ansible.builtin.assert:
    that: firewall_ssh_sources | length > 0
    fail_msg: firewall_ssh_sources is empty, so the firewall would refuse every SSH connection.
    quiet: true

- name: Write the ruleset (checked with nft before it is saved)
  ansible.builtin.template:
    src: ops-firewall.nft.j2
    dest: /etc/ops-firewall.nft
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload the firewall

- name: Install the firewall's service
  ansible.builtin.copy:
    src: ops-firewall.service
    dest: /etc/systemd/system/ops-firewall.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload the firewall

- name: Load the firewall now and at every boot
  ansible.builtin.systemd_service:
    name: ops-firewall
    enabled: true
    state: started
    daemon_reload: true
