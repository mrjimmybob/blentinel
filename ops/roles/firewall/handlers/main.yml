---
# Replacing the table is one transaction: the old rules hold until the new ones
# are in, and an SSH session already open stays open (established traffic).
- name: Reload the firewall
  ansible.builtin.systemd_service:
    name: ops-firewall
    state: reloaded
    daemon_reload: true
  # As in the tasks: in check mode a new unit doesn't exist yet.
  when: not (ansible_check_mode and firewall_unit.changed)
