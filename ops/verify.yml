---
# Read-only: checks that the machines are what the playbooks make them, and
# changes nothing. Run it after a rebuild and whenever in doubt:
#   ansible-playbook verify.yml --ask-become-pass
- name: Verify the managed machines
  hosts: lab_control:staging
  become: true
  gather_facts: false
  vars:
    connect_test: |
      import socket, sys
      s = socket.socket()
      s.settimeout(5)
      try:
          s.connect((sys.argv[1], int(sys.argv[2])))
          print("open")
      except OSError as e:
          print("unreachable", e)
    # A packet the machine's own output chain drops fails at once with EPERM,
    # but only for UDP: TCP retries its SYN and just times out, which would
    # look the same as a host that is down. So the egress check sends UDP.
    send_test: |
      import socket, sys
      s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
      try:
          s.sendto(b"", (sys.argv[1], int(sys.argv[2])))
          print("sent")
      except PermissionError:
          print("blocked")
  tasks:
    - name: Read sshd's effective settings
      ansible.builtin.command: /usr/sbin/sshd -T
      register: sshd
      changed_when: false

    - name: Check sshd takes keys only, refuses root, and lets in only the listed users
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshd.stdout_lines"
          - "'permitrootlogin no' in sshd.stdout_lines"
          - "('allowusers ' ~ base_admin_user | default('ops')) in sshd.stdout_lines"
        quiet: true

    - name: Read the admin account's authorized_keys
      ansible.builtin.stat:
        path: "~{{ base_admin_user | default('ops') }}/.ssh/authorized_keys"
      register: keys_file

    - name: Check only the admin account can write it
      ansible.builtin.assert:
        that: keys_file.stat.mode == '0600'
        fail_msg: "authorized_keys has mode {{ keys_file.stat.mode }}, not 0600."
        quiet: true

    - name: Read the private inventory's folder and the key to staging (lab-control)
      ansible.builtin.stat:
        path: "{{ item }}"
      register: private
      loop:
        - "{{ lab_control_config_dir | default('/etc/blentinel-ops') }}/inventory"
        - "~{{ base_admin_user | default('ops') }}/.ssh/{{ lab_control_staging_key | default('blentinel_staging') }}"
      when: ops_environment == 'lab_control'

    - name: Check only the admin account can read them
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode in ['0600', '0700']
          - item.stat.pw_name == base_admin_user | default('ops')
        fail_msg: "{{ item.item }} is missing, or not the admin account's alone."
        quiet: true
      loop: "{{ private.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('') }}"
      when: ops_environment == 'lab_control'

    - name: Check sshd lets the deployment account in (staging)
      ansible.builtin.assert:
        that: "'allowusers blentinel-deploy' in sshd.stdout_lines"
        quiet: true
      when: ops_environment == 'staging'

    - name: Read the deployment agent's secrets and key (lab-control)
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: agent_files
      loop:
        - {path: /etc/blentinel-deploy-agent/github-token, owner: root, group: deployer, mode: "0440"}
        - {path: /etc/blentinel-deploy-agent/agent.conf, owner: root, group: deployer, mode: "0640"}
        - {path: /var/lib/blentinel-deploy-agent/.ssh/id_ed25519, owner: deployer, group: deployer, mode: "0600"}
        - {path: /usr/local/lib/blentinel-deploy-agent/agent, owner: root, group: root, mode: "0755"}
        - {path: /usr/local/lib/blentinel-deploy-agent/verify-release.sh, owner: root, group: root, mode: "0644"}
      loop_control:
        label: "{{ item.path }}"
      when: ops_environment == 'lab_control'

    - name: Check only the agent reads them, and nobody but root changes what it runs (lab-control)
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == item.item.owner
          - item.stat.gr_name == item.item.group
          - item.stat.mode == item.item.mode
        fail_msg: "{{ item.item.path }} isn't {{ item.item.owner }}:{{ item.item.group }} {{ item.item.mode }}."
        quiet: true
      loop: "{{ agent_files.results | default([]) }}"
      loop_control:
        label: "{{ item.item.path | default('') }}"
      when: ops_environment == 'lab_control'

    - name: Read whether the agent's timer runs (lab-control)
      ansible.builtin.command: # noqa: command-instead-of-module
        argv: [systemctl, is-active, blentinel-deploy-agent.timer]
      register: agent_timer
      changed_when: false
      when: ops_environment == 'lab_control'

    - name: Check it runs (lab-control)
      ansible.builtin.assert:
        that: agent_timer.stdout == 'active'
        quiet: true
      when: ops_environment == 'lab_control'

    # The agent's own SSH options, as its user: the forced command answers
    # `status`, and refuses anything else, whatever the client asks.
    - name: Ask staging for its status with the agent's key (lab-control)
      ansible.builtin.command:
        argv: "{{ ['runuser', '-u', 'deployer', '--'] + agent_ssh + ['status'] }}"
      vars: &agent_ssh
        agent_ssh:
          - ssh
          - -F
          - /dev/null
          - -i
          - /var/lib/blentinel-deploy-agent/.ssh/id_ed25519
          - -o
          - BatchMode=yes
          - -o
          - IdentitiesOnly=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - UserKnownHostsFile=/etc/blentinel-deploy-agent/known_hosts
          - -o
          - GlobalKnownHostsFile=/dev/null
          - blentinel-deploy@{{ hostvars[groups['staging'][0]].ansible_host }}
      register: agent_status
      changed_when: false
      when: ops_environment == 'lab_control'

    - name: Check staging answered it
      ansible.builtin.assert:
        that: agent_status.stdout_lines | select('match', status_keys) | list | length == 4
      vars:
        status_keys: '^(version|active|running_sha256|tls_pin)='
        fail_msg: "staging's status: {{ agent_status.stdout }}"
        quiet: true
      when: ops_environment == 'lab_control'

    - name: Ask staging for something else with the agent's key (lab-control)
      ansible.builtin.command:
        argv: "{{ ['runuser', '-u', 'deployer', '--'] + agent_ssh + ['id'] }}"
      vars: *agent_ssh
      register: agent_other
      changed_when: false
      failed_when: false
      when: ops_environment == 'lab_control'

    - name: Check the forced command refused it
      ansible.builtin.assert:
        that:
          - agent_other.rc == 64
          - "'uid=' not in agent_other.stdout"
        fail_msg: "staging ran it: {{ agent_other.rc }} {{ agent_other.stdout }}"
        quiet: true
      when: ops_environment == 'lab_control'

    - name: Check Ansible runs (lab-control)
      ansible.builtin.command: ansible-playbook --version
      changed_when: false
      when: ops_environment == 'lab_control'

    - name: Read the firewall's table
      ansible.builtin.command: /usr/sbin/nft list table inet ops
      register: table
      changed_when: false

    - name: Check incoming traffic is dropped unless allowed
      ansible.builtin.assert:
        that: "'hook input priority filter; policy drop;' in table.stdout"
        quiet: true

    - name: Check each port opened to its sources is in it (staging, the hub's)
      ansible.builtin.assert:
        that: ("tcp dport " ~ item.port ~ " ip saddr") in table.stdout
        fail_msg: "The firewall doesn't open port {{ item.port }}."
        quiet: true
      loop: "{{ firewall_tcp_allow | default([]) }}"
      loop_control:
        label: "{{ item.port }}"

    - name: Check what hub.sh needs is installed (staging)
      ansible.builtin.command:
        argv: [sh, -c, command -v curl openssl sha256sum tar]
      changed_when: false
      when: ops_environment == 'staging'

    - name: Check outgoing traffic is dropped unless allowed (lab-control)
      ansible.builtin.assert:
        that: "'hook output priority filter; policy drop;' in table.stdout"
        quiet: true
      when: firewall_egress_filter | default(false)

    # A read-only query: the systemd module would enable them, not tell.
    - name: Read which services start at boot
      ansible.builtin.command: # noqa: command-instead-of-module
        argv: [systemctl, is-enabled, ops-firewall.service, apt-daily-upgrade.timer]
      register: enabled
      changed_when: false

    - name: Check the firewall and the security updates start at boot
      ansible.builtin.assert:
        that: enabled.stdout_lines == ['enabled', 'enabled']
        quiet: true

    - name: Read apt's update settings
      ansible.builtin.command: apt-config dump APT::Periodic
      register: periodic
      changed_when: false

    - name: Check security updates are installed every day
      ansible.builtin.assert:
        that: "'APT::Periodic::Unattended-Upgrade \"1\";' in periodic.stdout_lines"
        quiet: true

    - name: Read whether the clock is synchronised
      ansible.builtin.command: timedatectl show --property NTP --value
      register: ntp
      changed_when: false
      when: not (ops_in_container | default(false))

    - name: Check the clock is synchronised over the network
      ansible.builtin.assert:
        that: ntp.stdout == 'yes'
        quiet: true
      when: not (ops_in_container | default(false))

    - name: Read the listening TCP ports
      ansible.builtin.command: ss --no-header --tcp --listening --numeric
      register: listening
      changed_when: false

    - name: Check only the expected ports listen beyond the machine itself
      vars:
        addresses: "{{ listening.stdout_lines | map('split') | map(attribute=3) | list }}"
        outside: >-
          {{ addresses
             | reject('match', '^(127\.|\[::1\]|\[::ffff:127\.)')
             | map('regex_replace', '^.*:', '') | map('int') | unique | sort }}
        expected: "{{ ([22] + (firewall_tcp_allow | default([]) | map(attribute='port') | list)) | unique | sort }}"
      ansible.builtin.assert:
        that: outside | difference(expected) | length == 0
        fail_msg: "Listening beyond the machine: {{ outside }}; expected only {{ expected }}."
        quiet: true

    - name: Try a connection the egress filter must refuse (lab-control)
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ send_test }}"
          - "{{ firewall_verify_blocked.host }}"
          - "{{ firewall_verify_blocked.port }}"
      register: blocked
      changed_when: false
      when: firewall_egress_filter | default(false)

    - name: Check the egress filter refused it
      ansible.builtin.assert:
        that: blocked.stdout == 'blocked'
        fail_msg: >-
          {{ firewall_verify_blocked.host }}:{{ firewall_verify_blocked.port }}
          answered '{{ blocked.stdout }}', not 'blocked'.
        quiet: true
      when: firewall_egress_filter | default(false)

    - name: Try SSH to each machine lab-control manages
      ansible.builtin.command:
        argv: [python3, -c, "{{ connect_test }}", "{{ item }}", "22"]
      register: managed
      changed_when: false
      loop: "{{ firewall_egress_ssh | default([]) }}"
      when: firewall_egress_filter | default(false)

    - name: Check each of them is reachable
      ansible.builtin.assert:
        that: item.stdout == 'open'
        fail_msg: "{{ item.item }}:22 answered '{{ item.stdout }}', not 'open'."
        quiet: true
      loop: "{{ managed.results | default([]) }}"
      loop_control:
        label: "{{ item.item | default('') }}"
      when: firewall_egress_filter | default(false)
