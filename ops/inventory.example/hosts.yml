---
# An example inventory, with documentation addresses (RFC 5737) and no real
# keys. The real one lives on lab-control in /etc/blentinel-ops/inventory/,
# owned by the admin account, mode 0700, and never in Git (docs/ops.md).
#
#   192.0.2.1    the LAN's DNS server
#   192.0.2.9    the admin's PC
#   192.0.2.28   lab-control
#   192.0.2.29   staging
all:
  children:
    lab_control:
      hosts:
        lab-control:
          # The playbooks run on lab-control itself.
          ansible_connection: local
          ops_environment: lab_control
          base_admin_keys:
            - ssh-ed25519 AAAA...replace-with-your-key admin-pc
          firewall_ssh_sources: [192.0.2.9]
          firewall_egress_filter: true
          firewall_egress_dns: [192.0.2.1]
          firewall_egress_ssh: [192.0.2.29]
          # verify.yml checks the egress filter refuses this one: pick a LAN
          # machine lab-control must never reach.
          firewall_verify_blocked: {host: 192.0.2.1, port: 22}
    staging:
      hosts:
        # A host can't share its group's name: Ansible would warn.
        blentinel-staging:
          ansible_host: 192.0.2.29
          ansible_user: ops
          ansible_ssh_private_key_file: ~/.ssh/blentinel_staging
          ops_environment: staging
          base_admin_keys:
            - ssh-ed25519 AAAA...replace-with-your-key admin-pc
            - ssh-ed25519 AAAA...replace-with-lab-controls-key lab-control
          firewall_ssh_sources: [192.0.2.9, 192.0.2.28]
          # Who may reach the hub (ports 3000 and 3443): your PC, and the
          # lab's probe machines as they join.
          staging_hub_sources: [192.0.2.9]
