---
- name: Configure lab-control
  hosts: lab_control
  become: true
  gather_facts: true
  pre_tasks:
    - name: Check the host is meant for this play
      ansible.builtin.assert:
        that: ops_environment | default('') == 'lab_control'
        fail_msg: "{{ inventory_hostname }} is in lab_control, but its ops_environment is not lab_control."
        quiet: true
  roles:
    - base
    - firewall
    - lab_control
    - deploy_agent
    - probe
  vars:
    # Probe on lab-control reports to the staging hub (proposal 0013 §10.4 E).
    # The enrollment code is in the control host's Vault, shared via group_vars/all.yml.
    probe_hub_url: "https://{{ deploy_agent_staging_address }}:{{ deploy_agent_hub_port }}"
    probe_company_id: staging
    probe_site_id: staging
    probe_site_name: Staging
