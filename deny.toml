# cargo-deny: what the CI gate's `deny` step checks about our dependencies
# (D-102, docs/ci.md). Run it with `cargo deny check` or `blentinelmake ci deny`.

[graph]
# Every platform we build for, so a dependency used on one only is checked too.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "armv7-unknown-linux-musleabihf",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]
all-features = true

# Known vulnerabilities, and crates whose authors say they are unmaintained or
# yanked, from the RustSec advisory database. An advisory that doesn't apply
# goes in `ignore` with its ID, why, and the date: like a known_issue_* test.
[advisories]
ignore = [
    # Both are procedural macros that Leptos's own macros use at compile time
    # (paste through either_of; proc-macro-error2 through rstml/syn_derive):
    # none of their code is in the hub or probe binaries, and no maintained
    # version exists yet. Drop these once Leptos moves off them. (2026-10-15)
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, compile-time only, via Leptos" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: unmaintained, compile-time only, via Leptos" },
    # The SQLite bundled in libsqlite3-sys 0.30 (through sqlx 0.8) can return
    # stale memory when it opens a crafted database and `-wal` pair
    # (CVE-2026-119375). The fix is libsqlite3-sys 0.39, which no sqlx release
    # accepts yet (0.9.0 takes <0.38). The hub's one exposed path, an archive on
    # a shared folder, refuses a `-wal` beside it. D-118; drop this with M0-33,
    # and a test (`the_sqlite_advisory_is_ignored_only_while_sqlite_needs_it`)
    # fails if this outlives the fix. (2026-11-15; first added 2026-11-11)
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite < 3.54: no sqlx release accepts libsqlite3-sys 0.39 yet; archives refuse a foreign -wal (D-118, M0-33)" },
    # "Unmaintained" notices, not vulnerabilities: these crates were merged
    # into zbus 6.0 as its `wire` module, so zbus 5 (the probe's D-Bus, for
    # systemd and SMART on Linux) uses their last standalone versions. zbus
    # 6.0.0 came out on 2026-10-16: the move is M0-28, once it has settled.
    # Only these three IDs are ignored: any other advisory, a vulnerability in
    # these crates included, still fails the check. Drop them with M0-28.
    # (2026-10-18)
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; zbus 5 in use until M0-28" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; zbus 5 in use until M0-28" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; zbus 5 in use until M0-28" },
]

# Blentinel is MIT-licensed and ships as binaries: every dependency's licence
# must let us do that. Only permissive licences; no copyleft (GPL, LGPL used
# alone, MPL), so nobody running a hub or probe inherits obligations.
[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # The Mozilla CA list as data (webpki-roots): a permissive data licence.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Duplicate versions of a crate are reported, not refused: the Windows and
# wasm crates come in several versions through the ecosystem.
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path.
allow-wildcard-paths = true

# Crates come from crates.io only: no git repository, no other registry.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
